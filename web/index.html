    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Masar</title>
    <meta name="description" content="Masar – plan, track and ship work with your team." />
    <meta name="theme-color" content="#0C66E4" />
  </head>
  <body>
    <div id="root">
      <main>
        <h1 class="sr-only">لوحة التحكم وإدارة المسارات | Masar</h1>
      </main>
    </div>
    <script>
      // Apply the saved theme before first paint so dark mode doesn't flash white.
      try {
        var t = localStorage.getItem('masar.theme') || 'light'
        var d = t === 'dark' || (t === 'system' && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.dataset.theme = d ? 'dark' : 'light'
        document.documentElement.style.colorScheme = d ? 'dark' : 'light'
        if (localStorage.getItem('masar.reduceMotion') === '1') document.documentElement.classList.add('reduce-motion')
      } catch (e) {}
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
