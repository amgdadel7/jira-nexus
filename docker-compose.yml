services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: masar
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d masar"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend-dotnet:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=masar;Username=postgres;Password=admin
      ASPNETCORE_ENVIRONMENT: Development
    ports: ["5000:8080"]
    depends_on:
      postgres:
        condition: service_healthy

  backend-node:
    build:
      context: ./api
      dockerfile: Dockerfile
    environment:
      PORT: 3000
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:admin@postgres:5432/masar
    ports: ["3000:8080"]
    depends_on:
      postgres:
        condition: service_healthy

  web:
    image: node:20-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
    volumes: ["./web:/app"]
    ports: ["5173:5173"]
    environment:
      VITE_API_URL: http://localhost:5000
    depends_on:
      - backend-dotnet

volumes:
  pgdata:
