services:
  # 1. Node.js Express API Service
  - type: web
    name: masar-node-api
    runtime: docker
    dockerfilePath: ./api/Dockerfile
    dockerContext: ./api
    plan: free
    region: frankfurt
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: 8080
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        sync: false
      - key: MIRAT_DSN
        sync: false

  # 2. React Web Frontend (Vite)
  - type: web
    name: masar-web
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    rootDir: web
    plan: free
    region: frankfurt
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: masar-node-api
          property: host

  # 3. .NET 8 Web API Service (Clean Architecture)
  - type: web
    name: masar-dotnet-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    region: frankfurt
    healthCheckPath: /health
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ConnectionStrings__DefaultConnection
        sync: false
      - key: MIRAT_DSN
        sync: false
