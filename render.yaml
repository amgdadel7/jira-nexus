services:
  # 1. Node.js Express API Service
  - type: web
    name: masar-node-api
    runtime: docker
    dockerfilePath: ./api/Dockerfile
    dockerContext: ./api
    plan: free
    region: frankfurt
    envVars:
      - key: PORT
        value: 8080
      - key: NODE_ENV
        value: production
      - key: MIRAT_DSN
        value: https://mirat-monitor.onrender.com/api/events/RgL_RlWnFwK3hv8s71BZu_89R2IOUpIO

  # 2. React Web Frontend (Vite)
  - type: web
    name: masar-web
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    rootDir: web
    plan: free
    region: frankfurt
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: masar-dotnet-api
          property: host

  # 3. .NET 8 Web API Service (Clean Architecture)
  - type: web
    name: masar-dotnet-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    region: frankfurt
    healthCheckPath: /health
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ConnectionStrings__DefaultConnection
        value: "Host=aws-0-ap-southeast-2.pooler.supabase.com;Port=5432;Database=postgres;Username=postgres.fxyotyjqzddlcmqxemkz;Password=E8homLoNlT3Qthn6;SSL Mode=Require;Trust Server Certificate=true"
      - key: MIRAT_DSN
        value: https://mirat-monitor.onrender.com/api/events/0XJUEMTBGD47buhgkf7WUBnvGWvXGFDt
